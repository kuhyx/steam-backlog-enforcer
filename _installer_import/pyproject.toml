[project]
name = "steam-game-installer"
version = "0.1.0"
description = "Fast Steam game installs: depotdownloader for speed, a hand-written manifest for recognition, a FOSS Proton to run them."
requires-python = ">=3.14"
# kuhy's shared "Created by kuhy" credit, shown at the end of --help.
dependencies = [
    "kuhy-credit @ git+https://github.com/kuhyx/utils@kuhy-credit-v0.3.2#subdirectory=kuhy_credit",
]

[project.scripts]
steam-game-installer = "steam_installer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["steam_installer"]
branch = true
# The `__main__` guard is exercised by running the module as a script in a
# subprocess; without this its coverage would be recorded in a child process
# and thrown away.
parallel = true
concurrency = ["multiprocessing"]

[tool.coverage.report]
# The suite covers every line and branch. Anything less is a regression, so
# make it fail rather than merely reporting a lower number.
fail_under = 100
show_missing = true
